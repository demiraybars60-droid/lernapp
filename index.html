<!DOCTYPE html>
<html lang="de" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>SWW I – Theorie-Lernkarten</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <style>
    html, body { -webkit-tap-highlight-color: transparent; }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .press { transition: transform .12s ease; }
    .press:active { transform: scale(.98); }
    /* Antwort mit Zeilenumbrüchen aus JSON (\n) darstellen */
    #cardAntwort { white-space: pre-line; }
    /* kurzes Aufleuchten der Karte nach Bewertung */
    @keyframes flashGreen { 0%{box-shadow:0 0 0 0 rgba(16,185,129,.0)} 30%{box-shadow:0 0 0 4px rgba(16,185,129,.9)} 100%{box-shadow:0 0 0 0 rgba(16,185,129,0)} }
    @keyframes flashAmber { 0%{box-shadow:0 0 0 0 rgba(245,158,11,.0)} 30%{box-shadow:0 0 0 4px rgba(245,158,11,.9)} 100%{box-shadow:0 0 0 0 rgba(245,158,11,0)} }
    @keyframes flashRose  { 0%{box-shadow:0 0 0 0 rgba(244,63,94,.0)}  30%{box-shadow:0 0 0 4px rgba(244,63,94,.9)}  100%{box-shadow:0 0 0 0 rgba(244,63,94,0)} }
    .flash-green{animation:flashGreen .5s ease}
    .flash-amber{animation:flashAmber .5s ease}
    .flash-rose {animation:flashRose  .5s ease}
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col safe-top safe-bottom select-none">

  <!-- Kopf: Titel + Live-Status (oben rechts) + Fortschritt -->
  <header class="px-4 pt-4">
    <div class="flex items-center justify-between mb-2 gap-2">
      <h1 class="text-base font-bold leading-tight">SWW&nbsp;I<span class="text-slate-400 font-normal"> · Theorie</span></h1>

      <!-- Live-Zähler oben rechts (nur in der Lernsession) -->
      <div id="statBar" class="hidden flex items-center gap-2 text-sm font-bold">
        <span class="flex items-center gap-1 text-emerald-400"><span>✅</span><span id="statGreen">0</span></span>
        <span class="flex items-center gap-1 text-amber-400"><span>🟠</span><span id="statAmber">0</span></span>
        <span class="flex items-center gap-1 text-rose-400"><span>🔴</span><span id="statRose">0</span></span>
      </div>

      <button id="resetBtn" class="text-xs text-slate-400 underline shrink-0">Zurücksetzen</button>
    </div>

    <div id="progressWrap" class="hidden">
      <div class="flex justify-between text-xs text-slate-400 mb-1">
        <span id="progressLabel">0 / 0 gemeistert</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="w-full h-2 bg-slate-700 rounded-full overflow-hidden">
        <div id="progressBar" class="h-full bg-emerald-500 transition-all duration-300" style="width:0%"></div>
      </div>
      <!-- Karten-Chips: eine kleine Nummer je Karte, Farbe = Status -->
      <div id="chipRow" class="flex flex-wrap gap-1.5 mt-3"></div>
    </div>
  </header>

  <main class="flex-1 flex flex-col px-4 py-6 max-w-xl w-full mx-auto">

    <!-- Startbildschirm: Tag auswählen -->
    <section id="homeScreen" class="flex-1 flex flex-col gap-5">
      <div class="text-center">
        <p class="text-slate-400 text-sm">Siedlungswasserwirtschaft I · 67 Lernkarten – Theorie + Formeln (Abwasser & Trinkwasser).<br>Wähle deinen Lerntag – in 6 Tagen sitzt alles.</p>
      </div>
      <div id="dayList" class="flex flex-col gap-3"></div>
      <button id="allBtn"
        class="press w-full bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow">
        Alle Karten mischen
      </button>
      <p id="homeHint" class="text-center text-xs text-slate-500"></p>
    </section>

    <!-- Lernkarte -->
    <section id="cardScreen" class="hidden flex-1 flex-col gap-4">
      <div id="cardBox" class="bg-slate-800 rounded-2xl p-6 shadow-lg flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <span id="cardThema" class="text-xs uppercase tracking-wide text-emerald-400 font-semibold"></span>
          <span id="cardBadge" class="text-xs font-bold px-2 py-0.5 rounded-full"></span>
        </div>
        <p id="cardFrage" class="text-2xl font-bold leading-snug"></p>

        <div id="answerBlock" class="hidden mt-6 pt-6 border-t border-slate-700">
          <p class="text-xs uppercase tracking-wide text-slate-400 mb-2">Antwort</p>
          <p id="cardAntwort" class="text-[17px] leading-relaxed text-slate-100"></p>
        </div>
      </div>

      <button id="showBtn"
        class="press w-full bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white text-lg font-bold py-5 rounded-2xl shadow">
        Antwort zeigen
      </button>

      <div id="rateButtons" class="hidden grid grid-cols-3 gap-2">
        <button data-grade="0"
          class="press bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold py-5 rounded-2xl text-sm shadow leading-tight">
          Wusste ich<br>nicht
        </button>
        <button data-grade="1"
          class="press bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-white font-bold py-5 rounded-2xl text-sm shadow leading-tight">
          Halb
        </button>
        <button data-grade="2"
          class="press bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-5 rounded-2xl text-sm shadow leading-tight">
          Wusste<br>ich
        </button>
      </div>
      <p id="rateHint" class="hidden text-center text-xs text-slate-500"></p>

      <button id="quitBtn" class="text-xs text-slate-500 underline mx-auto mt-1">Pausieren – Fortschritt ist gespeichert</button>
    </section>

    <!-- Fertig -->
    <section id="doneScreen" class="hidden flex-1 flex flex-col items-center justify-center text-center gap-6">
      <p class="text-5xl">🎉</p>
      <div>
        <p class="text-2xl font-bold">Alles gemeistert!</p>
        <p id="doneSummary" class="text-slate-400 mt-1"></p>
      </div>
      <button id="backHomeBtn"
        class="press w-full max-w-sm bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-white text-lg font-bold py-5 rounded-2xl shadow">
        Zurück zur Auswahl
      </button>
    </section>

  </main>

  <footer class="text-center text-xs text-slate-600 pb-4 px-4">
    Offline-fähig · Fortschritt wird lokal gespeichert
  </footer>

  <script>
  (function () {
    "use strict";

    const STORAGE_KEY = "lernapp_progress_v2";

    const el = (id) => document.getElementById(id);
    const homeScreen = el("homeScreen");
    const cardScreen = el("cardScreen");
    const doneScreen = el("doneScreen");
    const progressWrap = el("progressWrap");
    const statBar = el("statBar");

    let questions = [];   // alle Fragen
    let store = {};        // { cards: { id: {status, mastered} } }

    // Session-Zustand
    let session = null;    // { cards:[{id, needs, status}], queue:[id...], mastered:0 }

    // ---------- Speicherung ----------
    function load() {
      try { store = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
      catch (e) { store = {}; }
      if (!store.cards) store.cards = {};
    }
    function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
    function cardState(id) {
      if (!store.cards[id]) store.cards[id] = { status: "neu", mastered: false, needs: 1 };
      return store.cards[id];
    }

    // ---------- Tage aus den Daten ableiten ----------
    function dayNumbers() {
      const set = new Set(questions.map((q) => q.tag || 1));
      return [...set].sort((a, b) => a - b);
    }
    function cardsOfDay(tag) {
      return questions.filter((q) => (q.tag || 1) === tag);
    }
    function masteredCount(cards) {
      return cards.filter((q) => cardState(q.id).mastered).length;
    }

    // ---------- UI-Helfer ----------
    function show(screen) {
      [homeScreen, cardScreen, doneScreen].forEach((s) => {
        s.classList.add("hidden"); s.classList.remove("flex");
      });
      screen.classList.remove("hidden");
      screen.classList.add("flex");
    }

    // Fortschritt EINES Tages zurücksetzen
    function resetDay(cards) {
      cards.forEach((q) => { delete store.cards[q.id]; });
      save();
      renderHome();
    }

    // ---------- Startbildschirm ----------
    function renderHome() {
      session = null;
      statBar.classList.add("hidden");
      progressWrap.classList.add("hidden");

      const list = el("dayList");
      list.innerHTML = "";
      const days = dayNumbers();

      days.forEach((tag) => {
        const cards = cardsOfDay(tag);
        const done = masteredCount(cards);
        const total = cards.length;
        const all = done === total && total > 0;
        // "angefangen": mind. eine Karte beantwortet, aber noch nicht alles gemeistert
        const touched = cards.some((q) => {
          const s = cardState(q.id);
          return s.mastered || (s.status && s.status !== "neu");
        });
        const inProgress = touched && !all;
        const sub = all ? "gemeistert" : (inProgress ? "weiter machen" : "starten");
        const accent = all ? "emerald" : (inProgress ? "sky" : "slate");

        const row = document.createElement("div");
        row.className = "flex items-stretch gap-2";

        const main = document.createElement("button");
        main.className =
          "press flex-1 text-left bg-slate-800 hover:bg-slate-700 active:bg-slate-800 " +
          "rounded-2xl px-5 py-4 shadow flex items-center justify-between gap-3 border " +
          (all ? "border-emerald-500" : (inProgress ? "border-sky-600" : "border-slate-700"));
        main.innerHTML =
          '<div>' +
            '<p class="text-lg font-bold">Tag ' + tag + '</p>' +
            '<p class="text-xs text-slate-400 mt-0.5">' + total + ' Karten · Thema ' +
              (cards[0] ? cards[0].thema : "") + ' u.&nbsp;a.</p>' +
          '</div>' +
          '<div class="text-right shrink-0">' +
            '<p class="text-sm font-bold ' + (all ? "text-emerald-400" : (inProgress ? "text-sky-400" : "text-slate-200")) + '">' +
              done + '/' + total + (all ? " ✅" : "") + '</p>' +
            '<p class="text-[11px] text-slate-500">' + sub + '</p>' +
          '</div>';
        main.addEventListener("click", () => startSession(cards, "Tag " + tag));
        row.appendChild(main);

        // Zurücksetzen-Knopf nur, wenn der Tag schon angefangen/gemeistert wurde
        if (touched) {
          const rb = document.createElement("button");
          rb.className =
            "press shrink-0 px-4 rounded-2xl bg-slate-800 border border-slate-700 " +
            "text-slate-400 hover:text-rose-300 hover:border-rose-500 text-xl";
          rb.textContent = "↺";
          rb.setAttribute("aria-label", "Tag " + tag + " zurücksetzen");
          rb.title = "Tag " + tag + " zurücksetzen";
          rb.addEventListener("click", (e) => {
            e.stopPropagation();
            if (confirm("Tag " + tag + " zurücksetzen? Der Fortschritt dieses Tages geht verloren.")) resetDay(cards);
          });
          row.appendChild(rb);
        }

        list.appendChild(row);
      });

      const total = questions.length;
      const totalDone = masteredCount(questions);
      el("homeHint").textContent = "Gesamt: " + totalDone + " / " + total + " Karten gemeistert";

      show(homeScreen);
    }

    // ---------- Session-Logik (Mastery) ----------
    // grade 0 = Wusste ich nicht (rot)  -> braucht 2 richtige HINTEREINANDER
    // grade 1 = Halb (orange)           -> braucht 1 richtige
    // grade 2 = Wusste ich (grün)       -> zählt als richtig (Zähler runter)
    function startSession(cards, label) {
      const shuffled = [...cards].sort(() => Math.random() - 0.5);
      // Zustand aus dem Speicher wiederherstellen (Fortsetzen)
      let scards = shuffled.map((q) => {
        const cs = cardState(q.id);
        const needs = (typeof cs.needs === "number") ? cs.needs : (cs.mastered ? 0 : 1);
        return { id: q.id, needs: needs, status: cs.status || "neu" };
      });
      // Alles schon gemeistert? -> kompletter Durchlauf als Wiederholung
      if (scards.every((c) => c.needs <= 0)) {
        scards = scards.map((c) => ({ id: c.id, needs: 1, status: "neu" }));
      }
      session = {
        label: label,
        cards: scards,
        queue: scards.filter((c) => c.needs > 0).map((c) => c.id),
        total: scards.length
      };
      progressWrap.classList.remove("hidden");
      statBar.classList.remove("hidden");
      renderChips();
      nextCard();
    }

    function sState(id) { return session.cards.find((c) => c.id === id); }

    function counts() {
      let green = 0, amber = 0, rose = 0, open = 0;
      for (const c of session.cards) {
        if (c.needs <= 0) { green++; continue; }
        open++;
        if (c.status === "rot") rose++;
        else if (c.status === "orange") amber++;
      }
      return { green, amber, rose, open };
    }

    function renderStats() {
      const c = counts();
      el("statGreen").textContent = c.green;
      el("statAmber").textContent = c.amber;
      el("statRose").textContent = c.rose;

      const done = c.green;
      const pct = session.total ? Math.round((done / session.total) * 100) : 0;
      el("progressLabel").textContent = done + " / " + session.total + " gemeistert";
      el("progressPct").textContent = pct + "%";
      el("progressBar").style.width = pct + "%";
    }

    function renderChips() {
      const row = el("chipRow");
      row.innerHTML = "";
      session.cards.forEach((c) => {
        const num = c.id.replace(/^q0?/, "");
        let cls = "bg-slate-700 text-slate-300"; // neu
        if (c.needs <= 0) cls = "bg-emerald-600 text-white";
        else if (c.status === "orange") cls = "bg-amber-500 text-white";
        else if (c.status === "rot") cls = "bg-rose-600 text-white";
        const chip = document.createElement("span");
        chip.className =
          "w-7 h-7 rounded-full text-[11px] font-bold flex items-center justify-center " + cls;
        chip.textContent = num;
        row.appendChild(chip);
      });
      renderStats();
    }

    function nextCard() {
      if (session.queue.length === 0) { finishSession(); return; }
      const id = session.queue[0];
      const q = questions.find((x) => x.id === id);
      const st = sState(id);

      el("cardThema").textContent = q.thema || "";
      el("cardFrage").textContent = q.frage;
      el("cardAntwort").textContent = q.antwort;

      // Status-Badge auf der Karte
      const badge = el("cardBadge");
      if (st.status === "rot") { badge.textContent = "nochmal (2×)"; badge.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-300"; }
      else if (st.status === "orange") { badge.textContent = "halb – nochmal"; badge.className = "text-xs font-bold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300"; }
      else { badge.textContent = ""; badge.className = ""; }

      el("answerBlock").classList.add("hidden");
      el("rateButtons").classList.add("hidden");
      el("rateHint").classList.add("hidden");
      el("showBtn").classList.remove("hidden");

      renderChips();
      show(cardScreen);
    }

    function showAnswer() {
      el("answerBlock").classList.remove("hidden");
      el("showBtn").classList.add("hidden");
      el("rateButtons").classList.remove("hidden");
      const hint = el("rateHint");
      hint.textContent = "🟠 Halb = 1× richtig nötig · 🔴 Falsch = 2× richtig hintereinander";
      hint.classList.remove("hidden");
    }

    function flash(kind) {
      const box = el("cardBox");
      box.classList.remove("flash-green", "flash-amber", "flash-rose");
      void box.offsetWidth; // Reflow, damit die Animation neu startet
      box.classList.add(kind === 2 ? "flash-green" : kind === 1 ? "flash-amber" : "flash-rose");
    }

    function rate(grade) {
      const id = session.queue.shift();
      const st = sState(id);

      if (grade === 2) {
        st.needs -= 1;              // eine richtige Antwort verbraucht
        if (st.needs <= 0) st.status = "gruen";
      } else if (grade === 1) {
        st.needs = 1;               // halb -> genau 1× richtig nötig
        st.status = "orange";
      } else {
        st.needs = 2;               // falsch -> 2× richtig hintereinander nötig
        st.status = "rot";
      }

      // Fortschritt sofort speichern (Pausieren/Fortsetzen möglich)
      const cs = cardState(id);
      cs.needs = st.needs;
      cs.status = st.status;
      cs.mastered = st.needs <= 0;
      save();

      flash(grade);

      if (st.needs > 0) {
        // Karte kommt wieder – ein paar Positionen weiter hinten
        const pos = Math.min(session.queue.length, 2);
        session.queue.splice(pos, 0, id);
      }

      // kurze Verzögerung, damit man das Aufleuchten sieht
      setTimeout(nextCard, 260);
      renderChips();
    }

    function finishSession() {
      // alle Karten der Session als gemeistert speichern
      session.cards.forEach((c) => {
        const cs = cardState(c.id);
        cs.mastered = true;
        cs.status = "gruen";
      });
      save();
      el("doneSummary").textContent =
        session.total + " Karten aus „" + session.label + "“ sitzen. Komm morgen zum nächsten Tag wieder!";
      statBar.classList.add("hidden");
      progressWrap.classList.add("hidden");
      show(doneScreen);
    }

    // ---------- Events ----------
    el("showBtn").addEventListener("click", showAnswer);
    el("backHomeBtn").addEventListener("click", renderHome);
    el("quitBtn").addEventListener("click", renderHome);
    el("allBtn").addEventListener("click", () => startSession(questions, "Alle Karten"));
    document.querySelectorAll("#rateButtons button").forEach((btn) => {
      btn.addEventListener("click", () => rate(parseInt(btn.dataset.grade, 10)));
    });
    el("resetBtn").addEventListener("click", () => {
      if (confirm("Gesamten Lernfortschritt zurücksetzen?")) {
        localStorage.removeItem(STORAGE_KEY);
        store = { cards: {} };
        renderHome();
      }
    });

    // ---------- Laden ----------
    async function init() {
      load();
      try {
        const res = await fetch("questions.json", { cache: "no-cache" });
        questions = await res.json();
      } catch (e) {
        document.querySelector("main").innerHTML =
          '<p class="text-rose-400 text-center mt-10">questions.json konnte nicht geladen werden.</p>';
        return;
      }
      renderHome();
    }
    init();

    // ---------- Service Worker ----------
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  })();
  </script>
</body>
</html>
